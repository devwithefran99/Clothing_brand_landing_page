<!doctype html>
<html lang="en" data-theme="dark" data-bs-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Brand</title>
  <meta name="description" content="">
  <meta name="theme-color" content="#0a0a0b">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400;0,6..96,500;0,6..96,600;1,6..96,400;1,6..96,500&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">

  <!-- Brand data. Bodlate hole shudhu ei file -->
  <script src="js/config.js"></script>
</head>

<body class="is-loading">

  <!-- Preloader -->
  <div class="preloader" id="preloader" aria-hidden="true">
    <div class="preloader-inner">
      <div id="preBrand"></div>
      <div class="preloader-bar"><i></i></div>
    </div>
  </div>

  <div class="scroll-progress" aria-hidden="true"><i id="progressBar"></i></div>

  <!-- Navigation -->
  <header class="site-nav" id="siteNav">
    <div class="container d-flex align-items-center justify-content-between">
      <a href="#top" class="brand" id="navBrand" aria-label="Home"></a>
      <nav class="nav-links d-none d-lg-flex" id="navLinks" aria-label="Primary"></nav>
      <div class="d-flex align-items-center gap-2">
        <a class="btn-icon" id="navWa" href="#contact" target="_blank" rel="noopener" aria-label="Chat on WhatsApp"><i class="bi bi-whatsapp"></i></a>
        <button class="btn-icon d-lg-none" type="button" data-bs-toggle="offcanvas" data-bs-target="#menu" aria-controls="menu" aria-label="Open menu"><i class="bi bi-list"></i></button>
      </div>
    </div>
  </header>

  <!-- Mobile menu -->
  <div class="offcanvas offcanvas-end menu" tabindex="-1" id="menu" aria-label="Menu" data-lenis-prevent>
    <div class="offcanvas-header px-4 pt-4">
      <span class="brand" id="menuBrand"></span>
      <button type="button" class="btn-icon" data-bs-dismiss="offcanvas" aria-label="Close menu"><i class="bi bi-x-lg"></i></button>
    </div>
    <div class="offcanvas-body px-4 d-flex flex-column">
      <nav class="menu-links" id="menuLinks"></nav>
      <div class="menu-contact mt-auto" id="menuContact"></div>
    </div>
  </div>

  <main>

    <!-- Hero -->
    <section class="hero" id="top">
      <div class="hero-bg" aria-hidden="true">
        <span class="orb orb-1"></span>
        <span class="orb orb-2"></span>
        <span class="hero-grid"></span>
      </div>
      <div class="container hero-inner">
        <div class="row align-items-center gy-4">
          <div class="col-lg-7 hero-copy">
            <p class="eyebrow" id="heroEyebrow"></p>
            <h1 class="hero-title" id="heroTitle"></h1>
            <p class="hero-sub" id="heroSub"></p>
            <div class="hero-cta" id="heroCta"></div>
            <ul class="hero-points" id="heroPoints"></ul>
          </div>
          <div class="col-lg-5">
            <div class="stage" id="stage" aria-label="Rotating product showcase. Drag to spin.">
              <span class="orbit" aria-hidden="true"></span>
              <div class="stage-float">
                <div class="ring" id="ring"></div>
              </div>
            </div>
          </div>
        </div>
      </div>
      <a class="scroll-cue" href="#collections" aria-label="Scroll to collections"><span></span>Scroll</a>
    </section>

    <!-- Marquee -->
    <div class="marquee" aria-hidden="true"><div class="marquee-track" id="marquee"></div></div>

    <!-- Collections -->
    <section class="section" id="collections">
      <div class="container">
        <div class="section-head" id="collectionsHead" data-reveal></div>
        <div class="row g-3 g-lg-4" id="collectionGrid" data-stagger></div>
      </div>
    </section>

    <!-- Shop -->
    <section class="section pt-0" id="shop">
      <div class="container">
        <div class="section-head d-flex flex-column flex-md-row align-items-md-end justify-content-between gap-3" data-reveal>
          <div id="shopHead"></div>
          <p class="shop-count" id="shopCount" aria-live="polite"></p>
        </div>
        <div class="filters mb-4" id="filters" role="tablist" aria-label="Filter products"></div>
        <div class="row g-3 g-lg-4" id="productGrid" data-stagger></div>
      </div>
    </section>

    <!-- Fabric story: pinned, rotates in 3D while you scroll -->
    <section class="story" id="story">
      <div class="container">
        <div class="row align-items-center gy-5">
          <div class="col-lg-6 order-lg-2">
            <div class="story-stage" id="storyStage">
              <span class="plinth" aria-hidden="true"></span>
              <div class="story-object" id="storyObject">
                <div class="face front" id="storyFront"></div>
                <div class="face back" id="storyBack"></div>
              </div>
            </div>
          </div>
          <div class="col-lg-6 order-lg-1" id="storyCopy"></div>
        </div>
      </div>
    </section>

    <!-- Perks -->
    <section class="section" id="perks">
      <div class="container">
        <div class="section-head" id="perksHead" data-reveal></div>
        <div class="row g-3 g-lg-4" id="perkGrid" data-stagger></div>
      </div>
    </section>

    <!-- Reviews (optional) -->
    <section class="section pt-0" id="reviews" hidden>
      <div class="container">
        <div class="section-head" id="reviewsHead" data-reveal></div>
        <div class="row g-3 g-lg-4" id="reviewGrid"></div>
      </div>
    </section>

    <!-- Contact -->
    <section class="section cta" id="contact">
      <span class="cta-shape s1" aria-hidden="true"></span>
      <span class="cta-shape s2" aria-hidden="true"></span>
      <span class="cta-shape s3" aria-hidden="true"></span>
      <div class="container position-relative">
        <h2 class="cta-title" id="ctaTitle" data-reveal></h2>
        <p class="cta-text" id="ctaText" data-reveal></p>
        <div class="cta-actions" id="ctaActions" data-reveal></div>
      </div>
    </section>

  </main>

  <footer class="site-footer" id="footer">
    <div class="container">
      <div class="row gy-5">
        <div class="col-lg-4 footer-brand" id="footerBrand"></div>
        <div class="col-6 col-lg-2 footer-col" id="footerShop"></div>
        <div class="col-6 col-lg-3 footer-col" id="footerHelp"></div>
        <div class="col-lg-3 footer-col" id="footerContact"></div>
      </div>
      <div class="footer-word" id="footerWord" aria-hidden="true"></div>
      <div class="footer-bottom" id="footerBottom"></div>
    </div>
  </footer>

  <!-- Floating actions -->
  <div class="fab">
    <button type="button" class="btn-icon fab-top" id="fabTop" aria-label="Back to top"><i class="bi bi-arrow-up"></i></button>
    <a class="fab-wa" id="fabWa" href="#contact" target="_blank" rel="noopener" aria-label="Order on WhatsApp"><i class="bi bi-whatsapp"></i></a>
  </div>

  <!-- Product modal -->
  <div class="modal fade" id="productModal" tabindex="-1" aria-labelledby="pmTitle" aria-hidden="true" data-lenis-prevent>
    <div class="modal-dialog modal-dialog-centered modal-lg">
      <div class="modal-content pm">
        <button type="button" class="btn-icon pm-close" data-bs-dismiss="modal" aria-label="Close"><i class="bi bi-x-lg"></i></button>
        <div class="row g-0">
          <div class="col-md-6"><div class="pm-media" id="pmMedia"></div></div>
          <div class="col-md-6">
            <div class="pm-body">
              <p class="pm-cat" id="pmCat"></p>
              <h3 class="pm-title" id="pmTitle"></h3>
              <div class="price pm-price" id="pmPrice"></div>
              <p class="pm-desc" id="pmDesc"></p>
              <p class="pm-label">Size</p>
              <div class="sizes" id="pmSizes" role="radiogroup" aria-label="Size"></div>
              <div class="d-grid gap-2">
                <a class="btn-brand justify-content-center" id="pmOrder" href="#" target="_blank" rel="noopener"><i class="bi bi-whatsapp"></i> Order on WhatsApp</a>
                <a class="btn-ghost justify-content-center" id="pmCall" href="#"><i class="bi bi-telephone"></i> Call to order</a>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <noscript><p style="position:fixed;inset:auto 0 0 0;padding:1rem;background:#000;color:#fff;text-align:center;z-index:3000">Please enable JavaScript to view this page.</p></noscript>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/ScrollTrigger.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/lenis@1.1.13/dist/lenis.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/vanilla-tilt@1.8.1/dist/vanilla-tilt.min.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
